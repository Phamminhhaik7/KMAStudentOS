openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: grades
    description: Grade crawling and curriculum operations
  - name: auth
    description: Portal authentication operations
  - name: timetable
    description: Student schedule and timetable operations from QLĐT portal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /grades:
    get:
      operationId: getGrades
      tags: [grades]
      summary: Fetch grades
      description: >-
        Fetches the student's grades from the ACTVN training portal using an
        optionally-provided session cookie. Falls back to bundled sample data
        when no cookie is provided or the live fetch fails. Also returns the
        GPA letter-grade scale and the curriculum's subject catalog (code,
        name, credits) used for autocomplete when adding planned subjects.
      parameters:
        - name: X-Portal-Cookie
          in: header
          required: false
          description: >-
            Session cookie string for the ACTVN training portal (either a
            26-character session id or a full "key=value; ..." cookie
            string). Omit to use bundled sample data.
          schema:
            type: string
        - name: X-Portal-User-Agent
          in: header
          required: false
          description: Custom User-Agent to present to the training portal.
          schema:
            type: string
      responses:
        "200":
          description: Grades fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradesResponse"
  /auth/microsoft-exchange:
    post:
      operationId: exchangeMicrosoftCode
      tags: [auth]
      summary: Exchange a Microsoft login redirect URL for a portal session cookie
      description: >-
        The ACTVN portal's Microsoft Edu login always redirects back to the
        school's own domain (its OAuth client is hardcoded to that
        redirect_uri), so the browser cannot capture the result directly.
        Instead, the user copies the final redirect URL (which contains a
        Microsoft `code` query parameter) and pastes it here. The server
        exchanges that code with the portal, resolves the portal's
        duplicate-named Set-Cookie headers (keeping the last value for each
        name), and returns a single usable session cookie string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicrosoftExchangeRequest"
      responses:
        "200":
          description: Session cookie resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftExchangeResponse"
        "400":
          description: The redirect URL is missing a Microsoft `code` query parameter.
        "502":
          description: The ACTVN portal did not return a session cookie for this code.
  /timetable:
    get:
      operationId: getTimetable
      tags: [timetable]
      summary: Fetch student timetable
      description: >-
        Fetches the student's registered courses and weekly class schedule from
        the ACTVN QLĐT portal using an optionally-provided ASP.NET session cookie.
        Falls back to bundled sample data when no cookie is provided or live fetch fails.
      parameters:
        - name: X-Qldt-Cookie
          in: header
          required: false
          description: Session cookie string for QLĐT (ASP.NET_SessionId=...; SignIn=...).
          schema:
            type: string
        - name: semester
          in: query
          required: false
          description: Optional semester ID to query.
          schema:
            type: string
      responses:
        "200":
          description: Timetable fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimetableResponse"
  /timetable/login:
    post:
      operationId: loginQldt
      tags: [timetable]
      summary: Login to QLĐT portal
      description: Authenticates with the QLĐT portal using student code and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QldtLoginRequest"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QldtLoginResponse"
        "401":
          description: Invalid username or password
        "502":
          description: Failed to reach QLĐT portal
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Grade:
      type: object
      description: A single exam/course record.
      properties:
        stt:
          type: string
        year:
          type: string
        term:
          type: string
        subject:
          type: string
        code:
          type: string
        credits:
          type: number
        attempt:
          type: string
        tp1:
          type: string
        tp2:
          type: string
        dqt:
          type: string
        exam:
          type: string
        course:
          type: string
        letter:
          type: string
      required:
        - stt
        - year
        - term
        - subject
        - code
        - credits
        - attempt
        - tp1
        - tp2
        - dqt
        - exam
        - course
        - letter
    Subject:
      type: object
      description: A curriculum subject available for planning.
      properties:
        code:
          type: string
        name:
          type: string
        credits:
          type: number
      required:
        - code
        - name
        - credits
    PortalUserInfo:
      type: object
      properties:
        name:
          type: string
        id:
          type: string
        email:
          type: string
      required:
        - name
        - id
        - email
    GradesResponse:
      type: object
      properties:
        isLive:
          type: boolean
          description: Whether the grades came from a live portal fetch or fallback sample data.
        grades:
          type: array
          items:
            $ref: "#/components/schemas/Grade"
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/Subject"
        gpaScale:
          type: object
          description: Letter grade to 4.0-scale GPA value mapping.
          additionalProperties:
            type: number
        userInfo:
          description: The logged-in student's info, or null when using sample data.
          oneOf:
            - $ref: "#/components/schemas/PortalUserInfo"
            - type: "null"
      required:
        - isLive
        - grades
        - subjects
        - gpaScale
        - userInfo
    MicrosoftExchangeRequest:
      type: object
      properties:
        redirectUrl:
          type: string
          description: >-
            The full URL the browser was redirected to after Microsoft login
            completed on the school's domain (must contain a `code` query
            parameter).
      required:
        - redirectUrl
    MicrosoftExchangeResponse:
      type: object
      properties:
        cookie:
          type: string
          description: >-
            Resolved ACTVN portal session cookie string, ready to use as the
            X-Portal-Cookie header on subsequent /grades requests.
      required:
        - cookie
    TimetableScheduleItem:
      type: object
      properties:
        raw:
          type: string
        phase:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        dayOfWeek:
          type: number
          description: 2 for Monday, 3 for Tuesday, ..., 8 for Sunday
        dayName:
          type: string
        periods:
          type: array
          items:
            type: number
        lessonType:
          type: string
        room:
          type: string
      required:
        - raw
        - phase
        - startDate
        - endDate
        - dayOfWeek
        - dayName
        - periods
        - lessonType
        - room
    TimetableCourse:
      type: object
      properties:
        stt:
          type: string
        className:
          type: string
        subjectName:
          type: string
        courseCode:
          type: string
        credits:
          type: number
        timeRaw:
          type: string
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/TimetableScheduleItem"
        room:
          type: string
        lecturer:
          type: string
        capacity:
          type: number
        enrolled:
          type: number
        tuition:
          type: string
        note:
          type: string
      required:
        - stt
        - className
        - subjectName
        - courseCode
        - credits
        - timeRaw
        - schedules
        - room
        - lecturer
        - capacity
        - enrolled
        - tuition
        - note
    SemesterOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        selected:
          type: boolean
      required:
        - id
        - name
        - selected
    TimetableResponse:
      type: object
      properties:
        isLive:
          type: boolean
        studentInfo:
          type: string
        studentId:
          type: string
        studentName:
          type: string
        studentMajor:
          type: string
        semesterName:
          type: string
        semesterYear:
          type: string
        semesterTerm:
          type: string
        semesters:
          type: array
          items:
            $ref: "#/components/schemas/SemesterOption"
        totalCredits:
          type: number
        courses:
          type: array
          items:
            $ref: "#/components/schemas/TimetableCourse"
      required:
        - isLive
        - studentInfo
        - studentId
        - studentName
        - studentMajor
        - semesterName
        - semesterYear
        - semesterTerm
        - semesters
        - totalCredits
        - courses
    QldtLoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    QldtLoginResponse:
      type: object
      properties:
        cookie:
          type: string
        studentInfo:
          type: string
        studentId:
          type: string
        studentName:
          type: string
      required:
        - cookie
        - studentInfo
        - studentId
        - studentName
